# Project labels for mergepay-web.
# Create them in the repo (GitHub → Issues → Labels), or with the GitHub CLI.

- name: "complexity: trivial"
  color: "BFE9F0"
  description: "Small, well-bounded task"

- name: "complexity: medium"
  color: "D7F94B"
  description: "Moderate scope, some design"

- name: "complexity: high"
  color: "FF8A3C"
  description: "Large or cross-cutting task"

- name: "good first issue"
  color: "0E8A16"
  description: "Good entry point for new contributors"

- name: "stellar"
  color: "08B5E5"
  description: "Touches Stellar / SEP flows"

- name: "design"
  color: "E99695"
  description: "UI / UX"

- name: "docs"
  color: "1D76DB"
  description: "Documentation only"
